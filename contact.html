<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Hello, World!</title>
    <style>
      :root { color-scheme: dark; } * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; overflow-x: hidden; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f8f7ff; background: #090b1a; }
      body::before, body::after { content: ""; position: fixed; width: 42rem; height: 42rem; border-radius: 50%; filter: blur(36px); opacity: .42; z-index: -1; } body::before { background: #6d4aff; top: -20rem; left: -15rem; } body::after { background: #00c2a8; right: -18rem; bottom: -22rem; }
      nav { width: min(92vw, 1080px); margin: 0 auto; padding: 1.6rem 0; display: flex; align-items: center; justify-content: space-between; } .brand { color: #fff; text-decoration: none; font-weight: 800; letter-spacing: -.04em; font-size: 1.15rem; } .brand span { color: #80ffe6; } .links { display: flex; gap: .35rem; } .links a { color: #c7c9e6; text-decoration: none; padding: .55rem .85rem; border-radius: 99px; font-size: .92rem; font-weight: 650; } .links a:hover, .links a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.12); }
      main { width: min(92vw, 920px); margin: clamp(2.5rem, 7vw, 6rem) auto; display: grid; grid-template-columns: .9fr 1.1fr; gap: clamp(2rem, 7vw, 6rem); align-items: start; } .eyebrow { margin: 0 0 1rem; color: #80ffe6; font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 750; } h1 { margin: 0; font-size: clamp(3.2rem, 7vw, 5.8rem); line-height: .96; letter-spacing: -.075em; background: linear-gradient(100deg, #fff 15%, #bbaeff 55%, #80ffe6); -webkit-background-clip: text; background-clip: text; color: transparent; } .copy { color: #dfe0f5; font-size: 1.08rem; line-height: 1.7; } .email { display: inline-block; margin-top: .7rem; color: #80ffe6; font-weight: 750; text-underline-offset: .22em; }
      form { padding: clamp(1.5rem, 4vw, 2.3rem); border: 1px solid rgba(255,255,255,.17); border-radius: 24px; background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.04)); box-shadow: 0 24px 70px rgba(0,0,0,.28); backdrop-filter: blur(18px); } label { display: block; margin: 0 0 .45rem; color: #e9e9f7; font-size: .9rem; font-weight: 750; } input, textarea { width: 100%; margin-bottom: 1.25rem; padding: .85rem .95rem; font: inherit; color: #fff; background: rgba(9,11,26,.5); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; outline: none; } input:focus, textarea:focus { border-color: #80ffe6; box-shadow: 0 0 0 3px rgba(128,255,230,.12); } textarea { min-height: 132px; resize: vertical; } button { width: 100%; padding: .9rem 1rem; color: #071513; background: #80ffe6; border: 0; border-radius: 99px; font: inherit; font-weight: 850; cursor: pointer; } button:hover { background: #a7ffeb; } @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <nav aria-label="Main navigation"><a class="brand" href="hello-world.html">hello<span>.</span></a><div class="links"><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></div></nav>
    <main>
      <section><p class="eyebrow">Get in touch</p><h1>Let’s make something wonderful.</h1><p class="copy">Whether you have a question, an idea, or simply want to say hello, we would love to hear from you.</p><a class="email" href="mailto:hello@example.com">hello@example.com</a></section>
      <form action="#" method="post"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required /><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required /><label for="message">Your message</label><textarea id="message" name="message" required></textarea><button type="submit">Send message →</button></form>
    </main>
  </body>
</html>
